<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#10131f" />
  <title>boyreese.de</title>
  <style>
    :root { --bg: #10131f; --panel: rgba(27, 32, 52, .88); --text: #f6f7ff; --muted: #a8afc8; --purple: #9b8cff; --cyan: #5de2e7; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 30px 16px; display: grid; place-items: center; color: var(--text); background: radial-gradient(circle at 15% 10%, #29265b 0, transparent 36%), radial-gradient(circle at 88% 85%, #193d50 0, transparent 32%), var(--bg); font: 16px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; }
    .hero { width: min(100%, 650px); text-align: center; }
    .eyebrow { color: var(--cyan); font-size: .75rem; letter-spacing: .2em; font-weight: 800; text-transform: uppercase; }
    h1 { margin: 10px 0; font-size: clamp(3rem, 13vw, 6rem); line-height: .9; letter-spacing: -.08em; }
    p { margin: 0 auto 28px; max-width: 450px; color: var(--muted); }
    .card { padding: 34px 26px; border: 1px solid rgba(255,255,255,.1); border-radius: 25px; background: var(--panel); box-shadow: 0 24px 70px rgba(0,0,0,.35); backdrop-filter: blur(18px); }
    .card h2 { margin: 0 0 7px; font-size: 1.35rem; }
    .card p { margin-bottom: 22px; font-size: .95rem; }
    a { display: inline-block; padding: 13px 24px; border-radius: 13px; color: var(--text); background: linear-gradient(100deg, var(--purple), #7069f6); font-weight: 800; text-decoration: none; box-shadow: 0 8px 24px rgba(112,105,246,.25); transition: transform .15s, filter .15s; }
    a:hover { transform: translateY(-2px); filter: brightness(1.1); }
    a:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
    footer { margin-top: 22px; color: var(--muted); font-size: .78rem; }
  </style>
</head>
<body>
  <main class="hero">
    <div class="eyebrow">boyreese.de</div>
    <h1>Willkommen.</h1>
    <div class="card">
      <h2>Tic Tac Toe</h2>
      <p>Spiele gegen den Computer oder fordere eine zweite Person heraus.</p>
      <a href="tictactoe.html">Spiel starten&nbsp; →</a>
    </div>
    <footer>Eine kleine Spielpause gefällig?</footer>
  </main>
</body>
</html>
