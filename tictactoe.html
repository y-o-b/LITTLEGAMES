<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4B8ED8" />
  <meta name="description" content="Tic Tac Toe gegen den Computer oder zu zweit." />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="application-name" content="Spiele" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Spiele" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="icon" href="icons/tictactoe.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/tictactoe.ico" sizes="48x48" />
  <link rel="apple-touch-icon" href="icons/tictactoe-180.png" />
  <title>Tic Tac Toe</title>
  <style>
    :root {
      --bg: #4B8ED8;
      --panel: #FFFFFF;
      --panel-light: #FFFFFF;
      --text: #171717;
      --muted: rgba(23,23,23,.7);
      --purple: #EF4B3F;
      --cyan: #171717;
      --pink: #EF4B3F;
      --line: #171717;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font: 16px/1.5 Arial, Helvetica, sans-serif;
      display: grid;
      justify-items: center;
      align-content: start;
      padding: 24px 16px 30px;
    }

    .app { width: min(100%, 560px); }
    .back-button { display: grid; place-items: center; width: 44px; height: 44px; position: absolute; left: 0; top: 50%; margin-top: -22px; border: 3px solid #171717; border-radius: 50%; color: #171717; background: #FFFFFF; box-shadow: 3px 3px 0 #171717; text-decoration: none; -webkit-tap-highlight-color: transparent; transition: transform .12s, box-shadow .12s; }
    .back-button svg { display: block; width: 24px; height: 24px; margin-right: 2px; fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    .back-button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #171717; }
    .back-button:focus-visible { outline: 3px solid #EF4B3F; outline-offset: 3px; }
    .version { display: block; margin: 8px auto 0; padding: 0; border: 0; color: var(--muted); background: transparent; font: inherit; font-size: .72rem; cursor: pointer; }
    .version:focus-visible { outline: 2px solid #171717; outline-offset: 3px; }
    header { position: relative; display: flex; align-items: center; justify-content: center; text-align: center; margin-bottom: 24px; }
    .eyebrow { color: var(--cyan); font-size: .75rem; letter-spacing: .2em; font-weight: 800; text-transform: uppercase; }
    h1 { font-size: clamp(2.4rem, 10vw, 4.5rem); line-height: .95; letter-spacing: -.07em; margin: 0; }
    .game {
      background: var(--panel);
      border: 3px solid var(--line);
      box-shadow: 7px 7px 0 #171717;
      border-radius: 18px;
      padding: clamp(18px, 5vw, 32px);
    }
    .mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; background: #171717; border-radius: 10px; margin-bottom: 22px; }
    button { font: inherit; cursor: pointer; border: 0; color: inherit; }
    .mode { border-radius: 10px; padding: 11px 8px; color: var(--muted); background: transparent; font-weight: 700; transition: .2s ease; }
    .mode.active { color: var(--text); background: var(--panel-light); box-shadow: 3px 3px 0 var(--purple); }
    .difficulty { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: -9px 2px 20px; color: var(--muted); font-size: .82rem; }
    .difficulty[hidden] { display: none; }
    .difficulty-options { display: flex; gap: 5px; }
    .difficulty-button { padding: 7px 10px; border: 2px solid #171717; border-radius: 8px; color: var(--muted); background: #FFFFFF; font-size: .78rem; }
    .difficulty-button.active { color: #FFFFFF; background: var(--purple); border-color: #171717; }
    .score { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 20px; }
    .score-card { text-align: center; background: #FFFFFF; border: 2px solid var(--line); border-radius: 10px; padding: 10px 4px; }
    .score-card strong { display: block; font-size: 1.45rem; line-height: 1.1; }
    .score-card span { color: var(--muted); font-size: .72rem; }
    .score-card:first-child strong { color: var(--cyan); }
    .score-card:last-child strong { color: var(--pink); }
    @keyframes victoryPulse { 0%, 100% { transform: scale(1); } 35% { transform: scale(1.025) rotate(-.4deg); } 70% { transform: scale(1.01) rotate(.4deg); } }
    @keyframes winnerPop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    .game.victory { animation: victoryPulse .8s ease; }
    .turn { text-align: center; color: var(--muted); font-size: .95rem; min-height: 29px; margin-bottom: 12px; }
    .turn b { color: var(--text); }
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 390px; margin: 0 auto 22px; }
    .cell { aspect-ratio: 1; border-radius: 10px; background: #FFFFFF; border: 3px solid #171717; color: var(--text); font-size: clamp(2.8rem, 13vw, 5rem); font-weight: 800; line-height: 1; box-shadow: 3px 3px 0 #171717; transition: background .15s; }
    .cell:focus-visible, .mode:focus-visible, .new-game:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
    .cell:disabled { cursor: default; }
    .cell.x { color: var(--cyan); }
    .cell.o { color: var(--pink); }
    .cell.winner { background: #EF4B3F; color: #FFFFFF; border-color: #171717; animation: winnerPop .65s ease; }
    .new-game { display: block; width: 100%; background: var(--purple); color: #FFFFFF; border: 3px solid #171717; border-radius: 10px; padding: 13px; font-weight: 800; box-shadow: 4px 4px 0 #171717; transition: transform .15s, filter .15s; }
    .new-game:hover { transform: translateY(-2px); filter: brightness(1.1); }
    @media (max-width: 390px) { .game { padding: 16px; } .cell { border-radius: 13px; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <a class="back-button" href="index.html" aria-label="Zur Startseite" title="Zur Startseite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8"/></svg></a>
      <h1>Tic Tac Toe</h1>
    </header>

    <section class="game" aria-label="Tic Tac Toe Spiel">
      <div class="mode-switch" role="group" aria-label="Spielmodus">
        <button class="mode active" data-mode="computer" type="button">1 Spieler · Computer</button>
        <button class="mode" data-mode="friends" type="button">2 Spieler</button>
      </div>
      <div class="difficulty" id="difficulty" aria-label="Spielstärke">
        <span>Spielstärke</span>
        <div class="difficulty-options" role="group" aria-label="Spielstärke auswählen">
          <button class="difficulty-button active" data-difficulty="easy" type="button">Einfach</button>
          <button class="difficulty-button" data-difficulty="medium" type="button">Mittel</button>
          <button class="difficulty-button" data-difficulty="hard" type="button">Schwer</button>
        </div>
      </div>
      <div class="score" aria-label="Punktestand">
        <div class="score-card"><strong id="scoreX">0</strong><span id="labelX">Du (X)</span></div>
        <div class="score-card"><strong id="scoreDraw">0</strong><span>Unentschieden</span></div>
        <div class="score-card"><strong id="scoreO">0</strong><span id="labelO">Computer (O)</span></div>
      </div>
      <div class="turn" id="turn" aria-live="polite"><b>Du bist dran</b> · Wähle ein Feld</div>
      <div class="board" role="grid" aria-label="Spielfeld">
        <button class="cell" data-index="0" role="gridcell" aria-label="Feld 1" type="button"></button>
        <button class="cell" data-index="1" role="gridcell" aria-label="Feld 2" type="button"></button>
        <button class="cell" data-index="2" role="gridcell" aria-label="Feld 3" type="button"></button>
        <button class="cell" data-index="3" role="gridcell" aria-label="Feld 4" type="button"></button>
        <button class="cell" data-index="4" role="gridcell" aria-label="Feld 5" type="button"></button>
        <button class="cell" data-index="5" role="gridcell" aria-label="Feld 6" type="button"></button>
        <button class="cell" data-index="6" role="gridcell" aria-label="Feld 7" type="button"></button>
        <button class="cell" data-index="7" role="gridcell" aria-label="Feld 8" type="button"></button>
        <button class="cell" data-index="8" role="gridcell" aria-label="Feld 9" type="button"></button>
      </div>
      <button class="new-game" id="newGame" type="button">Neues Spiel</button>
    </section>
    <button class="version" data-version type="button" title="Klicken, um die Seite neu zu laden">Version 0.90</button>
    <script>const versionButton = document.querySelector('[data-version]'); versionButton.addEventListener('click', () => location.replace(`${location.pathname}?v=${Date.now()}`)); fetch(`VERSION?${Date.now()}`, { cache: 'no-store' }).then(response => response.text()).then(version => { versionButton.textContent = `Version ${version.trim()}`; }).catch(() => {});</script>
  </main>

  <script>
    const cells = [...document.querySelectorAll('.cell')];
    const turnText = document.getElementById('turn');
    const modeButtons = [...document.querySelectorAll('.mode')];
    const difficultyButtons = [...document.querySelectorAll('.difficulty-button')];
    const difficultyPanel = document.getElementById('difficulty');
    const scores = { X: 0, O: 0, draw: 0 };
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    let board = Array(9).fill(''), current = 'X', gameOver = false, mode = 'computer', difficulty = 'easy';

    function result(state) {
      for (const line of wins) if (line.every(i => state[i] && state[i] === state[line[0]])) return { winner: state[line[0]], line };
      return state.every(Boolean) ? { winner: 'draw', line: [] } : null;
    }
    function setTurn(message) { turnText.innerHTML = message; }
    function drawBoard() {
      cells.forEach((cell, i) => {
        cell.textContent = board[i]; cell.className = 'cell' + (board[i] ? ' ' + board[i].toLowerCase() : '');
        cell.disabled = Boolean(board[i]) || gameOver || (mode === 'computer' && current === 'O');
        cell.setAttribute('aria-label', board[i] ? `Feld ${i + 1}: ${board[i]}` : `Feld ${i + 1}: frei`);
      });
      document.getElementById('scoreX').textContent = scores.X;
      document.getElementById('scoreO').textContent = scores.O;
      document.getElementById('scoreDraw').textContent = scores.draw;
    }
    function finish(outcome) {
      gameOver = true;
      if (outcome.winner === 'draw') { scores.draw++; setTurn('<b>Unentschieden!</b> · Gut gespielt'); }
      else { scores[outcome.winner]++; setTurn(`<b>${outcome.winner === 'X' ? (mode === 'computer' ? 'Du' : 'Spieler 1') : (mode === 'computer' ? 'Computer' : 'Spieler 2')} gewinnt!</b> · Stark gemacht`); }
      drawBoard();
      if (outcome.winner !== 'draw') document.querySelector('.game').classList.add('victory');
      outcome.line.forEach(i => cells[i].classList.add('winner'));
    }
    function play(index, isComputer = false) {
      if (gameOver || board[index] || (mode === 'computer' && current === 'O' && !isComputer)) return;
      board[index] = current; drawBoard();
      const outcome = result(board); if (outcome) return finish(outcome);
      current = current === 'X' ? 'O' : 'X';
      if (mode === 'computer' && current === 'O') { setTurn('<b>Computer denkt nach …</b>'); setTimeout(computerMove, 450); }
      else setTurn(`<b>${current === 'X' ? 'Spieler 1 (X)' : 'Spieler 2 (O)'} ist dran</b>`);
      drawBoard();
    }
    function computerMove() {
      if (gameOver) return;
      const empty = board.map((value, i) => value ? null : i).filter(i => i !== null);
      let move;
      if (difficulty === 'easy') move = empty[Math.floor(Math.random() * empty.length)];
      else if (difficulty === 'medium') move = findTactical('O') ?? findTactical('X') ?? empty[Math.floor(Math.random() * empty.length)];
      else move = bestMove();
      play(move, true);
    }
    function findTactical(mark) { for (const line of wins) { const values = line.map(i => board[i]); if (values.filter(v => v === mark).length === 2 && values.includes('')) return line[values.indexOf('')]; } return null; }
    function bestMove() {
      let bestScore = -Infinity, move = 0;
      board.forEach((value, i) => { if (!value) { board[i] = 'O'; const score = minimax(false); board[i] = ''; if (score > bestScore) { bestScore = score; move = i; } } });
      return move;
    }
    function minimax(maximizing) {
      const outcome = result(board);
      if (outcome) return outcome.winner === 'O' ? 10 : outcome.winner === 'X' ? -10 : 0;
      const scores = [];
      board.forEach((value, i) => { if (!value) { board[i] = maximizing ? 'O' : 'X'; scores.push(minimax(!maximizing)); board[i] = ''; } });
      return maximizing ? Math.max(...scores) : Math.min(...scores);
    }
    function reset() { board = Array(9).fill(''); current = 'X'; gameOver = false; document.querySelector('.game').classList.remove('victory'); drawBoard(); setTurn('<b>Du bist dran</b> · Wähle ein Feld'); }
    modeButtons.forEach(button => button.addEventListener('click', () => { mode = button.dataset.mode; modeButtons.forEach(b => b.classList.toggle('active', b === button)); difficultyPanel.hidden = mode !== 'computer'; document.getElementById('labelX').textContent = mode === 'computer' ? 'Du (X)' : 'Spieler 1 (X)'; document.getElementById('labelO').textContent = mode === 'computer' ? 'Computer (O)' : 'Spieler 2 (O)'; reset(); }));
    difficultyButtons.forEach(button => button.addEventListener('click', () => { difficulty = button.dataset.difficulty; difficultyButtons.forEach(b => b.classList.toggle('active', b === button)); reset(); }));
    cells.forEach(cell => cell.addEventListener('click', () => play(Number(cell.dataset.index))));
    document.getElementById('newGame').addEventListener('click', reset);
    drawBoard();
  </script>
  <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
