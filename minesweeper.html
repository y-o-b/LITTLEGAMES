<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4B8ED8" />
  <meta name="description" content="Detektor: Finde Minen, markiere falsche Flaggen und folge dem Metalldetektor." />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="application-name" content="Spiele" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Spiele" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="icon" href="icons/minesweeper.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/minesweeper-180.png" />
  <title>Detektor</title>
  <style>
    :root { --bg: #4B8ED8; --panel: #FFFFFF; --text: #171717; --muted: rgba(23,23,23,.7); --red: #EF4B3F; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px 15px; display: grid; justify-items: center; align-content: start; color: var(--text); background: var(--bg); font: 16px/1.5 Arial, Helvetica, sans-serif; }
    .app { width: min(100%, 620px); }
    .back-button { display: grid; place-items: center; width: 44px; height: 44px; position: absolute; left: 0; top: 50%; margin-top: -22px; border: 3px solid #171717; border-radius: 50%; color: #171717; background: #FFFFFF; box-shadow: 3px 3px 0 #171717; text-decoration: none; -webkit-tap-highlight-color: transparent; transition: transform .12s, box-shadow .12s; }
    .back-button svg { display: block; width: 24px; height: 24px; margin-right: 2px; fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    .back-button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #171717; }
    .back-button:focus-visible { outline: 3px solid #EF4B3F; outline-offset: 3px; }
    .version { display: block; margin: 14px auto 0; padding: 0; border: 0; color: var(--muted); background: transparent; font: inherit; font-size: .72rem; cursor: pointer; }
    header { position: relative; display: flex; align-items: center; justify-content: center; text-align: center; margin-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(2.2rem, 9vw, 4rem); line-height: .95; letter-spacing: -.07em; }
    .game { padding: clamp(14px, 4vw, 26px); border: 3px solid #171717; border-radius: 18px; background: var(--panel); box-shadow: 7px 7px 0 #171717; }
    button { border: 0; color: inherit; font: inherit; cursor: pointer; }
    .settings { display: grid; gap: 10px; margin-bottom: 16px; }
    .setting-row { display: grid; grid-template-columns: minmax(86px, .75fr) minmax(0, 1.25fr); align-items: center; gap: 8px; color: var(--muted); font-size: .82rem; }
    .setting-buttons { display: flex; justify-content: flex-end; gap: 5px; }
    .setting-button { min-width: 0; padding: 7px 8px; border: 2px solid #171717; border-radius: 8px; color: var(--muted); background: #FFFFFF; font-size: .78rem; white-space: nowrap; }
    .setting-button.active { color: #FFFFFF; background: var(--red); }
    .mine-setting { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
    .mine-setting input { width: 100%; min-width: 0; margin: 0; accent-color: var(--red); }
    .mine-setting output { min-width: 3.8em; color: var(--text); font-size: .78rem; font-weight: 800; text-align: right; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; text-align: center; }
    .stat { padding: 8px 3px; border: 2px solid #171717; border-radius: 10px; }
    .stat strong { display: block; font-size: 1.3rem; line-height: 1.1; }
    .stat span { color: var(--muted); font-size: .7rem; }
    .board-tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-bottom: 14px; }
    .flag-toggle, .hint-button { padding: 9px; border: 3px solid #171717; border-radius: 10px; font-weight: 800; }
    .flag-toggle { width: 100%; background: #FFFFFF; }
    .flag-toggle[aria-pressed="true"] { color: #FFFFFF; background: var(--red); }
    .hint-button { background: #FFD166; white-space: nowrap; }
    .hint { margin: -6px 0 14px; color: var(--muted); text-align: center; font-size: .75rem; }
    .message { min-height: 27px; margin: 0 0 10px; color: var(--muted); text-align: center; font-size: .9rem; }
    .message b { color: var(--text); }
    .board { display: grid; gap: 2px; margin: 0 auto 18px; width: 100%; max-width: 540px; padding: 4px; border: 3px solid #171717; border-radius: 10px; background: #171717; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    .cell { aspect-ratio: 1; min-width: 0; min-height: 0; overflow: hidden; padding: 0; border-radius: 3px; color: #171717; background: #4B8ED8; font-weight: 900; font-size: clamp(1rem, 5vw, 1.5rem); line-height: 1; -webkit-tap-highlight-color: transparent; }
    .shovel-action { position: absolute; z-index: 2; top: 50%; left: 50%; display: grid; place-items: center; width: 84%; aspect-ratio: 1; border: 2px solid #171717; border-radius: 8px; background: rgba(255,255,255,.95); box-shadow: 2px 2px 0 #171717; transform: translate(-50%, -50%); }
    .shovel-action svg { display: block; width: 100%; height: 100%; }
    .cell.open { background: #FFFFFF; cursor: default; }
    @keyframes revealCell { from { opacity: .45; transform: scale(.72); } to { opacity: 1; transform: scale(1); } }
    .cell.opening { animation: revealCell .18s ease-out; }
    .cell.flag { background: #4B8ED8; font-size: clamp(1.2rem, 6vw, 1.7rem); }
    .cell.mine { background: #EF4B3F; }
    .cell.wrong { background: #FFD166; }
    .cell.hint-safe, .cell.hint-mine { color: #FFFFFF; background: var(--bg); }
    .cell.wrong-flag { outline: 4px solid #EF4B3F; outline-offset: -5px; }
    .metal-detector { position: fixed; z-index: 1000; display: none; width: 46px; height: 46px; margin: -23px 0 0 -23px; pointer-events: none; filter: drop-shadow(2px 2px 1px rgba(0,0,0,.45)); transition: left .12s linear, top .12s linear; }
    .metal-detector.active { display: block; }
    .metal-detector svg { display: block; width: 100%; height: 100%; overflow: visible; }
    @keyframes flagWave { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
    .cell.flag.wave { animation: none; }
    .flag-icon { display: inline-block; transform-origin: 50% 100%; }
    .cell.flag.wave .flag-icon { animation: flagWave .45s ease-in-out 3; }
    .cell.n1 { color: #1f6fd0; } .cell.n2 { color: #2a9d4a; } .cell.n3 { color: #EF4B3F; } .cell.n4 { color: #6a3fc0; } .cell.n5 { color: #b5651d; } .cell.n6 { color: #14a0a0; } .cell.n7 { color: #171717; } .cell.n8 { color: #777; }
    .cell:focus-visible { outline: 3px solid #EF4B3F; outline-offset: -3px; }
    @media (prefers-reduced-motion: reduce) { .cell.flag.wave { animation: none; } .cell.opening { animation-duration: .01ms; } }
    @media (max-width: 600px) { .game.medium-mode .board, .game.hard-mode .board { width: calc(100% + 18px); max-width: none; margin-left: -9px; margin-right: -9px; } }
    .new-game { display: block; width: 100%; padding: 12px; border: 3px solid #171717; border-radius: 10px; color: #FFFFFF; background: var(--red); font-weight: 800; box-shadow: 4px 4px 0 #171717; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <a class="back-button" href="index.html" aria-label="Zur Startseite" title="Zur Startseite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8"/></svg></a>
      <h1>Detektor</h1>
    </header>
    <section class="game" aria-label="Detektor-Spiel">
      <div class="settings" aria-label="Spielfeldeinstellungen">
        <div class="setting-row">
          <span>Größe</span>
          <div class="setting-buttons" role="group" aria-label="Spielfeldgröße">
            <button class="setting-button" data-size="9x9" type="button">9×9</button>
            <button class="setting-button" data-size="12x12" type="button">12×12</button>
            <button class="setting-button" data-size="12x21" type="button">12×21</button>
          </div>
        </div>
        <div class="setting-row">
          <label for="mineCount">Anzahl Minen</label>
          <div class="mine-setting">
            <input id="mineCount" type="range" min="1" max="28" value="10" />
            <output id="mineCountValue" for="mineCount">10 / 28</output>
          </div>
        </div>
      </div>
      <div class="stats" aria-label="Spielstatistik">
        <div class="stat"><strong id="mines">0</strong><span>Minen übrig</span></div>
        <div class="stat"><strong id="moves">0</strong><span>Felder offen</span></div>
        <div class="stat"><strong id="time">0:00</strong><span>Zeit</span></div>
      </div>
      <div class="board-tools">
        <button class="flag-toggle" id="flagToggle" type="button" aria-pressed="false">⚑ Flaggen-Modus: aus</button>
        <button class="hint-button" id="hintButton" type="button">💡 Hinweis</button>
      </div>
      <p class="hint">Tipp: Rechtsklick, langes Drücken oder den Flaggen-Modus verwenden.</p>
      <p class="message" id="message" aria-live="polite"><b>Bereit?</b> Der erste Zug ist immer sicher.</p>
      <div class="board" id="board" role="grid" aria-label="Minenfeld"></div>
      <div class="metal-detector" id="metalDetector" aria-hidden="true"><svg viewBox="0 0 64 64"><rect x="7" y="5" width="29" height="13" rx="4" fill="#EF4B3F" stroke="#171717" stroke-width="3"/><rect x="12" y="8" width="9" height="5" rx="1" fill="#FFFFFF"/><path d="M30 17 48 47" fill="none" stroke="#171717" stroke-width="6" stroke-linecap="round"/><path d="M31 19 46 44" fill="none" stroke="#4B8ED8" stroke-width="2"/><ellipse cx="49" cy="53" rx="12" ry="6" transform="rotate(-28 49 53)" fill="none" stroke="#171717" stroke-width="4"/></svg></div>
      <button class="new-game" id="newGame" type="button">Neues Spiel</button>
    </section>
    <button class="version" data-version type="button" title="Klicken, um die Seite neu zu laden">Version 1.43</button>
    <script>const versionButton = document.querySelector('[data-version]'); versionButton.addEventListener('click', () => location.replace(`${location.pathname}?v=${Date.now()}`)); fetch(`VERSION?${Date.now()}`, { cache: 'no-store' }).then(response => response.text()).then(version => { versionButton.textContent = `Version ${version.trim()}`; }).catch(() => {});</script>
  </main>
  <script>
    const boardSizes = { '9x9': { cols: 9, rows: 9 }, '12x12': { cols: 12, rows: 12 }, '12x21': { cols: 12, rows: 21 } };
    const boardElement = document.getElementById('board'), message = document.getElementById('message'), flagToggle = document.getElementById('flagToggle'), gamePanel = document.querySelector('.game'), detectorElement = document.getElementById('metalDetector');
    const mineCountInput = document.getElementById('mineCount'), mineCountOutput = document.getElementById('mineCountValue');
    const SIZE_STORAGE_KEY = 'y-o-b.minesweeper.size.v1', MINE_COUNT_STORAGE_KEY = 'y-o-b.minesweeper.mine-count.v1', LEVEL_STORAGE_KEY = 'y-o-b.minesweeper.level.v1';
    let boardSize = '9x9', mineCount = 10, grid = [], over = false, placed = false, flagMode = false, seconds = 0, timer = null, openCount = 0, flagCount = 0, pressTimer = null, longPressed = false, autoSafeTimer = null, revealTimers = [], revealing = false, detectorTimers = [], detectorRun = 0, shovelIndex = null;
    const maxMineCount = size => ({ '9x9': 60, '12x12': 80, '12x21': 120 })[size];
    try {
      const savedSize = localStorage.getItem(SIZE_STORAGE_KEY), savedMineCount = localStorage.getItem(MINE_COUNT_STORAGE_KEY);
      const validSavedMineCount = Number.isInteger(Number(savedMineCount)) && Number(savedMineCount) > 0;
      if (boardSizes[savedSize]) boardSize = savedSize;
      if (validSavedMineCount) mineCount = Number(savedMineCount);
      const legacyPresets = { easy: ['9x9', 10], medium: ['12x12', 25], hard: ['12x21', 40] }, legacy = legacyPresets[localStorage.getItem(LEVEL_STORAGE_KEY)];
      if (legacy) { if (!boardSizes[savedSize]) boardSize = legacy[0]; if (!validSavedMineCount) mineCount = legacy[1]; }
    } catch (error) { console.warn('Detektor-Einstellungen konnten nicht geladen werden.', error); }
    mineCount = Math.min(mineCount, maxMineCount(boardSize));
    document.querySelectorAll('[data-size]').forEach(button => button.classList.toggle('active', button.dataset.size === boardSize));
    function updateMineControl() { const max = maxMineCount(boardSize); mineCount = Math.min(mineCount, max); mineCountInput.max = max; mineCountInput.value = mineCount; mineCountOutput.value = `${mineCount} / ${max}`; mineCountOutput.textContent = `${mineCount} / ${max}`; }
    updateMineControl();
    const config = () => ({ ...boardSizes[boardSize], mines: mineCount });
    function saveSettings() { try { localStorage.setItem(SIZE_STORAGE_KEY, boardSize); localStorage.setItem(MINE_COUNT_STORAGE_KEY, String(mineCount)); } catch (error) { console.warn('Detektor-Einstellungen konnten nicht gespeichert werden.', error); } }
    const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
    const neighbors = (index) => { const { cols, rows } = config(), x = index % cols, y = Math.floor(index / cols), list = []; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { if (!dx && !dy) continue; const nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && nx < cols && ny < rows) list.push(ny * cols + nx); } return list; };
    function start() {
      stopDetector();
      shovelIndex = null;
      gamePanel.classList.toggle('medium-mode', boardSize === '12x12'); gamePanel.classList.toggle('hard-mode', boardSize === '12x21');
      clearInterval(timer); timer = null; clearTimeout(pressTimer); clearTimeout(autoSafeTimer); revealTimers.forEach(clearTimeout); revealTimers = []; revealing = false; autoSafeTimer = null; const { cols, rows } = config();
      grid = Array.from({ length: cols * rows }, () => ({ mine: false, open: false, opening: false, flag: false, wrongFlag: false, hint: '', guess: false, count: 0 })); over = false; placed = false; seconds = openCount = flagCount = 0;
      boardElement.style.gridTemplateColumns = `repeat(${cols}, 1fr)`; boardElement.innerHTML = '';
      grid.forEach((cell, index) => {
        const button = document.createElement('button'); button.type = 'button'; button.className = 'cell'; button.dataset.index = index; button.setAttribute('role', 'gridcell'); button.setAttribute('aria-label', 'Verdecktes Feld');
        button.addEventListener('animationend', event => { if (event.animationName === 'revealCell') { cell.opening = false; button.classList.remove('opening'); } });
        button.addEventListener('click', event => {
          if (longPressed) { longPressed = false; return; }
          if (flagMode) { clearShovel(); toggleFlag(index); return; }
          if (shovelIndex === index && (event.target.closest?.('.shovel-action') || event.detail === 0)) { clearShovel(); reveal(index); return; }
          selectShovel(index);
        });
        button.addEventListener('contextmenu', event => { event.preventDefault(); if (event.button === 2) toggleFlag(index); });
        let pressStart = null;
        button.addEventListener('pointerdown', event => { if (event.pointerType === 'mouse') return; longPressed = false; pressStart = { x: event.clientX, y: event.clientY }; clearTimeout(pressTimer); pressTimer = setTimeout(() => { pressTimer = null; longPressed = true; toggleFlag(index); }, 450); });
        button.addEventListener('pointermove', event => { if (pressStart && Math.hypot(event.clientX - pressStart.x, event.clientY - pressStart.y) > 12) { clearTimeout(pressTimer); pressTimer = null; pressStart = null; } });
        ['pointerup', 'pointerleave', 'pointercancel'].forEach(type => button.addEventListener(type, () => { clearTimeout(pressTimer); pressTimer = null; pressStart = null; }));
        boardElement.appendChild(button);
      });
      document.getElementById('time').textContent = '0:00'; message.innerHTML = '<b>Bereit?</b> Der erste Zug ist immer sicher.'; updateStats();
    }
    function placeMines(safe) {
      const forbidden = new Set([safe, ...neighbors(safe)]), choices = grid.map((_, index) => index).filter(index => !forbidden.has(index));
      for (let i = choices.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [choices[i], choices[j]] = [choices[j], choices[i]]; }
      choices.slice(0, config().mines).forEach(index => { grid[index].mine = true; });
      grid.forEach((cell, index) => { cell.count = neighbors(index).filter(n => grid[n].mine).length; });
      placed = true; timer = setInterval(() => { seconds++; document.getElementById('time').textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`; }, 1000);
    }
    function draw(index) {
      const cell = grid[index], button = boardElement.children[index];
      button.className = 'cell' + (cell.open ? ' open' : '') + (cell.opening ? ' opening' : '') + (cell.open && cell.count > 0 && !cell.mine ? ` n${cell.count}` : '') + (cell.flag && !cell.open ? ' flag' : '') + (cell.hint ? ` hint-${cell.hint}` : '') + (cell.wrongFlag && cell.flag ? ' wrong-flag' : '') + (over && cell.mine && !cell.flag ? ' mine' : '') + (over && cell.flag && !cell.mine ? ' wrong' : '');
      const label = cell.flag && !over ? '⚑' : over && cell.mine ? (cell.flag ? '⚑' : '✹') : over && cell.flag && !cell.mine ? '✕' : cell.hint && !cell.open ? '?' : cell.open && cell.count > 0 ? cell.count : '';
      button.replaceChildren(); if (label) { const content = document.createElement('span'); content.className = cell.flag && (over || !cell.open) ? 'flag-icon' : ''; content.textContent = label; button.appendChild(content); }
      if (shovelIndex === index && !cell.open && !cell.flag && !over) {
        const shovel = document.createElement('span'); shovel.className = 'shovel-action'; shovel.setAttribute('aria-hidden', 'true');
        shovel.innerHTML = '<svg viewBox="0 0 32 32"><path d="M9 5h10M14 6v15" fill="none" stroke="#171717" stroke-width="3.5" stroke-linecap="round"/><path d="m14 19-7 8q7 4 15 0l-8-8Z" fill="#EF4B3F" stroke="#171717" stroke-width="2.5" stroke-linejoin="round"/></svg>';
        button.appendChild(shovel);
      }
      button.setAttribute('aria-label', cell.open ? (cell.count ? `${cell.count} Minen in der Nähe` : 'Leeres Feld') : shovelIndex === index && !cell.flag ? 'Schaufel über dem Feld; erneut aktivieren, um zu öffnen' : cell.wrongFlag && cell.flag ? 'Falsch gesetzte Flagge' : cell.hint === 'safe' ? 'Sicheres Feld' : cell.hint === 'mine' ? 'Sichere Mine' : cell.flag ? 'Flagge' : 'Verdecktes Feld');
    }
    function clearShovel() { const previous = shovelIndex; shovelIndex = null; if (previous !== null && grid[previous] && boardElement.children[previous]) draw(previous); }
    function selectShovel(index) {
      const cell = grid[index]; if (over || revealing || !cell || cell.open || cell.flag || shovelIndex === index) return;
      const previous = shovelIndex; shovelIndex = index; if (previous !== null && grid[previous]) draw(previous); draw(index);
    }
    function updateStats() { document.getElementById('mines').textContent = config().mines - flagCount; document.getElementById('moves').textContent = openCount; }
    function hasWrongFlags() { return grid.some(cell => cell.flag && !cell.mine); }
    function clearHints() { grid.forEach(cell => { cell.hint = ''; cell.wrongFlag = false; }); }
    function stopDetector() { detectorRun++; detectorTimers.forEach(clearTimeout); detectorTimers = []; detectorElement.classList.remove('active'); }
    function moveDetector(index) { const cell = boardElement.children[index], rect = cell.getBoundingClientRect(); detectorElement.style.left = `${rect.left + rect.width / 2}px`; detectorElement.style.top = `${rect.top + rect.height / 2}px`; }
    function sweepDetector(marked, target) {
      stopDetector(); const run = detectorRun, stops = [...new Set(marked)].sort((a, b) => a - b); if (!stops.includes(target)) stops.push(target);
      detectorElement.classList.add('active'); moveDetector(stops[0]);
      const delay = Math.max(30, Math.min(110, 900 / stops.length));
      stops.forEach((index, step) => detectorTimers.push(setTimeout(() => { if (run === detectorRun) moveDetector(index); }, step * delay)));
      detectorTimers.push(setTimeout(() => {
        if (run !== detectorRun) return; moveDetector(target);
        detectorTimers.push(setTimeout(() => {
          if (run !== detectorRun) return;
          detectorTimers = []; detectorElement.classList.remove('active');
          if (!over && !hasWrongFlags() && grid[target]?.guess) { message.innerHTML = '<b>Kein sicherer Tipp möglich.</b> Der Metalldetektor hat ein sicheres Feld gefunden und öffnet es.'; reveal(target); }
        }, 350));
      }, stops.length * delay + 100));
    }
    function analyzeDeductions() {
      const certainMines = new Set(), certainSafe = new Set();
      grid.forEach((cell, index) => {
        if (!cell.open || !cell.count) return;
        const nearby = neighbors(index), unknown = nearby.filter(item => !grid[item].open && !grid[item].flag);
        const remaining = cell.count - nearby.filter(item => grid[item].flag).length;
        if (!unknown.length) return;
        if (remaining === 0) unknown.forEach(item => certainSafe.add(item));
        else if (remaining === unknown.length) unknown.forEach(item => certainMines.add(item));
      });
      return { certainMines, certainSafe };
    }
    function updateGuessMarks() {
      stopDetector();
      grid.forEach(cell => { cell.guess = false; });
      clearTimeout(autoSafeTimer); autoSafeTimer = null;
      if (!placed || over) { grid.forEach((_, index) => draw(index)); return; }
      const { certainMines, certainSafe } = analyzeDeductions(), guesses = new Set();
      grid.forEach((cell, index) => {
        if (!cell.open || !cell.count) return;
        const nearby = neighbors(index), unknown = nearby.filter(item => !grid[item].open && !grid[item].flag);
        const remaining = cell.count - nearby.filter(item => grid[item].flag).length;
        if (!unknown.length) return;
        if (remaining <= 0 || remaining === unknown.length) return;
        unknown.forEach(item => guesses.add(item));
      });
      if (!certainMines.size && !certainSafe.size) {
        guesses.forEach(index => { grid[index].guess = true; });
        const safeGuesses = [...guesses].filter(index => !grid[index].mine);
        const safeGuess = safeGuesses[Math.floor(Math.random() * safeGuesses.length)];
        if (safeGuess !== undefined && !hasWrongFlags()) {
          autoSafeTimer = setTimeout(() => { autoSafeTimer = null; if (!over && !hasWrongFlags() && grid[safeGuess]?.guess) sweepDetector([...guesses], safeGuess); }, 700);
        }
      }
      grid.forEach((_, index) => draw(index));
    }
    function showHint() {
      if (over || revealing) return;
      clearTimeout(autoSafeTimer); autoSafeTimer = null; stopDetector(); clearShovel(); clearHints();
      if (!placed) { message.innerHTML = '<b>Decke zuerst ein Feld auf.</b> Danach kann ich einen Hinweis geben.'; return; }
      const wrongFlags = grid.filter(cell => cell.flag && !cell.mine);
      if (wrongFlags.length) {
        wrongFlags.forEach(cell => { cell.wrongFlag = true; });
        grid.forEach((_, index) => draw(index));
        message.innerHTML = `<b>${wrongFlags.length === 1 ? 'Eine Flagge ist falsch.' : `${wrongFlags.length} Flaggen sind falsch.`}</b> Korrigiere sie; es wird kein Feld automatisch geöffnet.`;
        return;
      }
      const { certainMines, certainSafe } = analyzeDeductions();
      certainMines.forEach(index => { grid[index].hint = 'mine'; });
      certainSafe.forEach(index => { grid[index].hint = 'safe'; });
      grid.forEach((_, index) => draw(index));
      const total = certainMines.size + certainSafe.size;
      message.innerHTML = total ? `<b>Hinweis:</b> ${certainSafe.size} sichere Felder und ${certainMines.size} sichere Minen markiert.` : '<b>Keine falschen Flaggen.</b> Aktuell ist kein weiteres Feld logisch entscheidbar.';
    }
    function toggleFlag(index) { if (over || revealing) return; const cell = grid[index]; if (cell.open) return; clearShovel(); clearHints(); cell.flag = !cell.flag; flagCount += cell.flag ? 1 : -1; updateGuessMarks(); updateStats(); }
    function reveal(index) {
      if (over || revealing || grid[index].flag || grid[index].open) return;
      stopDetector(); clearShovel();
      clearHints();
      if (!placed) placeMines(index);
      if (grid[index].mine) return lose(index);
      const queue = [index], queued = new Set(queue), sequence = [];
      while (queue.length) {
        const current = queue.shift(), cell = grid[current];
        if (cell.open || cell.flag) continue;
        sequence.push(current);
        if (cell.count === 0) neighbors(current).forEach(next => { if (!queued.has(next) && !grid[next].open && !grid[next].flag) { queued.add(next); queue.push(next); } });
      }
      if (!sequence.length) return;
      revealing = true;
      const delay = reduceMotion() ? 15 : 30;
      sequence.forEach((current, step) => revealTimers.push(setTimeout(() => {
        const cell = grid[current]; if (over || !cell || cell.open) return;
        cell.open = true; cell.opening = true; openCount++; draw(current); updateStats();
        if (step === sequence.length - 1) { revealTimers = []; revealing = false; updateGuessMarks(); updateStats(); if (openCount === grid.length - config().mines) win(); }
      }, step * delay)));
    }
    function finish() { over = true; revealing = false; revealTimers.forEach(clearTimeout); revealTimers = []; clearInterval(timer); grid.forEach((_, index) => draw(index)); }
    function lose(index) { finish(); boardElement.children[index].classList.add('mine'); message.innerHTML = '<b>Boom!</b> Eine Mine wurde ausgelöst. Versuche es noch einmal.'; }
    function win() { grid.forEach(cell => { if (cell.mine) cell.flag = true; }); flagCount = config().mines; finish(); updateStats(); boardElement.querySelectorAll('.cell.flag').forEach((cell, index) => { cell.style.animationDelay = `${index * 35}ms`; cell.classList.add('wave'); }); message.innerHTML = `<b>Gewonnen!</b> Alle Minen gefunden in ${document.getElementById('time').textContent}.`; }
    flagToggle.addEventListener('click', () => { clearShovel(); flagMode = !flagMode; flagToggle.setAttribute('aria-pressed', flagMode); flagToggle.textContent = `⚑ Flaggen-Modus: ${flagMode ? 'an' : 'aus'}`; });
    document.getElementById('hintButton').addEventListener('click', showHint);
    document.querySelectorAll('[data-size]').forEach(button => button.addEventListener('click', () => { boardSize = button.dataset.size; updateMineControl(); saveSettings(); document.querySelectorAll('[data-size]').forEach(item => item.classList.toggle('active', item === button)); start(); }));
    mineCountInput.addEventListener('input', () => { mineCountOutput.value = `${mineCountInput.value} / ${mineCountInput.max}`; mineCountOutput.textContent = mineCountOutput.value; });
    mineCountInput.addEventListener('change', () => { mineCount = Number(mineCountInput.value); updateMineControl(); saveSettings(); start(); });
    document.getElementById('newGame').addEventListener('click', start); start();
  </script>
  <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
