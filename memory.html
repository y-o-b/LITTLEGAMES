<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4B8ED8" />
  <title>Memory · boyreese.de</title>
  <style>
    :root { --bg: #4B8ED8; --panel: #FFFFFF; --card: #FFFFFF; --text: #171717; --muted: rgba(23,23,23,.7); --purple: #EF4B3F; --cyan: #171717; --pink: #EF4B3F; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 25px 15px; display: grid; place-items: center; color: var(--text); background: var(--bg); font: 16px/1.5 Arial, Helvetica, sans-serif; }
    .app { width: min(100%, 620px); }
    .home-link { display: inline-block; margin-bottom: 16px; color: var(--muted); font-size: .82rem; text-decoration: none; }
    .home-link:hover { color: var(--text); }
    header { text-align: center; margin-bottom: 20px; }
    .eyebrow { color: var(--cyan); font-size: .75rem; letter-spacing: .2em; font-weight: 800; text-transform: uppercase; }
    h1 { margin: 7px 0 8px; font-size: clamp(2.7rem, 11vw, 4.7rem); line-height: .95; letter-spacing: -.07em; }
    header p { margin: 0; color: var(--muted); }
    .game { padding: clamp(17px, 4vw, 28px); border: 3px solid #171717; border-radius: 18px; background: var(--panel); box-shadow: 7px 7px 0 #171717; }
    .mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 4px; margin-bottom: 19px; border-radius: 10px; background: #171717; }
    .mode { padding: 9px; border-radius: 9px; color: var(--muted); background: transparent; font-weight: 700; }
    .mode.active { color: var(--text); background: #FFFFFF; }
    .sizes { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 20px; color: var(--muted); font-size: .82rem; }
    .size-buttons { display: flex; gap: 5px; }
    button { border: 0; color: inherit; font: inherit; cursor: pointer; }
    .size { padding: 7px 10px; border: 2px solid #171717; border-radius: 8px; color: var(--muted); background: #FFFFFF; font-size: .78rem; }
    .size.active { color: #FFFFFF; background: var(--purple); border-color: #171717; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; text-align: center; }
    .stat { padding: 8px 3px; border: 2px solid #171717; border-radius: 10px; background: #FFFFFF; }
    .stat strong { display: block; color: var(--cyan); font-size: 1.3rem; line-height: 1.1; }
    .stat span { color: var(--muted); font-size: .7rem; }
    @keyframes victoryPulse { 0%, 100% { transform: scale(1); } 35% { transform: scale(1.025) rotate(-.4deg); } 70% { transform: scale(1.01) rotate(.4deg); } }
    @keyframes matchedPop { 0%, 100% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(180deg) scale(1.1); } }
    .game.victory { animation: victoryPulse .8s ease; }
    .players { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: -7px 0 18px; }
    .players[hidden] { display: none; }
    .player { padding: 7px; border: 1px solid transparent; border-radius: 10px; color: var(--muted); text-align: center; font-size: .78rem; }
    .player.active { color: var(--text); border-color: #171717; background: #F5F5F5; }
    .player strong { display: block; color: var(--cyan); font-size: 1.25rem; }
    .board { display: grid; gap: 8px; margin: 0 auto 21px; max-width: 540px; }
    .memory-card { position: relative; aspect-ratio: 1; min-width: 0; border-radius: 10px; background: var(--bg); color: transparent; font-size: clamp(1.35rem, 7vw, 2.8rem); border: 3px solid #171717; box-shadow: 3px 3px 0 #171717; transform-style: preserve-3d; transition: transform .25s ease; }
    .board[data-size="8"] .memory-card { font-size: clamp(1.8rem, 8vw, 3.6rem); }
    .board[data-size="12"] .memory-card { font-size: clamp(1.45rem, 6.5vw, 2.8rem); }
    .board[data-size="18"] .memory-card { font-size: clamp(1.1rem, 5vw, 2.2rem); }
    .memory-card::before, .memory-card::after { position: absolute; inset: 0; display: grid; place-items: center; backface-visibility: hidden; }
    .memory-card::before { content: '?'; color: #FFFFFF; font-size: .8em; font-weight: 800; }
    .memory-card::after { content: attr(data-icon); color: var(--text); background: #FFFFFF; transform: rotateY(180deg); }
    .memory-card.flipped, .memory-card.matched { transform: rotateY(180deg); }
    .memory-card.flipped::after, .memory-card.matched::after { background: var(--symbol-bg, #FFFFFF); }
    .memory-card.matched { color: var(--cyan); background: #DDEEFF; box-shadow: 3px 3px 0 #171717; animation: matchedPop .65s ease; }
    .memory-card:disabled { cursor: default; }
    button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
    .new-game { display: block; width: 100%; padding: 12px; border: 3px solid #171717; border-radius: 10px; color: #FFFFFF; background: var(--purple); font-weight: 800; box-shadow: 4px 4px 0 #171717; }
    .new-game:hover { filter: brightness(1.1); }
    .message { min-height: 27px; margin: 0 0 10px; color: var(--muted); text-align: center; font-size: .9rem; }
    .message b { color: var(--text); }
    .version { display: block; margin: 14px auto 0; padding: 0; border: 0; color: var(--muted); background: transparent; font: inherit; font-size: .72rem; cursor: pointer; }
    .version:focus-visible { outline: 2px solid #171717; outline-offset: 3px; }
    @media (max-width: 400px) { .game { padding: 15px; } .board { gap: 5px; } .memory-card { border-radius: 8px; } .size { padding: 6px 7px; } }
  </style>
</head>
<body>
  <main class="app">
    <a class="home-link" href="index.html">← Zur Startseite</a>
    <header>
      <h1>Memory</h1>
      <p>Finde alle Paare und trainiere dein Gedächtnis.</p>
    </header>
    <section class="game" aria-label="Memory-Spiel">
      <div class="mode-switch" role="group" aria-label="Spielmodus">
        <button class="mode active" data-mode="single" type="button">1 Spieler</button>
        <button class="mode" data-mode="two" type="button">2 Spieler</button>
      </div>
      <div class="sizes">
        <span>Größe</span>
        <div class="size-buttons" role="group" aria-label="Spielfeldgröße">
          <button class="size active" data-size="8" type="button">4 × 4</button>
          <button class="size" data-size="12" type="button">4 × 6</button>
          <button class="size" data-size="18" type="button">6 × 6</button>
        </div>
      </div>
      <div class="stats" aria-label="Spielstatistik">
        <div class="stat"><strong id="pairs">0</strong><span>Paare</span></div>
        <div class="stat"><strong id="moves">0</strong><span>Züge</span></div>
        <div class="stat"><strong id="time">0:00</strong><span>Zeit</span></div>
      </div>
      <div class="players" id="players" hidden aria-label="Punktestand der Spieler">
        <div class="player active" id="player1">Spieler 1<strong>0</strong></div>
        <div class="player" id="player2">Spieler 2<strong>0</strong></div>
      </div>
      <p class="message" id="message" aria-live="polite"><b>Bereit?</b> Finde das erste Paar.</p>
      <div class="board" id="board" role="grid" aria-label="Memory-Spielfeld"></div>
      <button class="new-game" id="newGame" type="button">Neues Spiel</button>
    </section>
    <button class="version" data-version type="button" title="Klicken, um die Seite neu zu laden">Version 0.77</button>
    <script>const versionButton = document.querySelector('[data-version]'); versionButton.addEventListener('click', () => location.replace(`${location.pathname}?v=${Date.now()}`)); fetch(`VERSION?${Date.now()}`, { cache: 'no-store' }).then(response => response.text()).then(version => { versionButton.textContent = `Version ${version.trim()}`; }).catch(() => {});</script>
  </main>
  <script>
    const icons = [
      { symbol: '🍕', color: '#FFD166' }, { symbol: '🚀', color: '#BDE0FE' }, { symbol: '🌈', color: '#FFC8DD' },
      { symbol: '🎧', color: '#CDB4DB' }, { symbol: '🐙', color: '#FFAFCC' }, { symbol: '🌵', color: '#B7E4C7' },
      { symbol: '🍩', color: '#F4A261' }, { symbol: '🦊', color: '#F6BD60' }, { symbol: '⚽', color: '#DDE7F0' },
      { symbol: '🎸', color: '#E9C46A' }, { symbol: '🌙', color: '#CDE7F0' }, { symbol: '🍉', color: '#B7E4C7' },
      { symbol: '🦄', color: '#E0C3FC' }, { symbol: '🎲', color: '#FFB4A2' }, { symbol: '🐳', color: '#A2D2FF' },
      { symbol: '🌻', color: '#FFE69C' }, { symbol: '🍀', color: '#C7F9CC' }, { symbol: '👾', color: '#B8C0FF' },
      { symbol: '🛸', color: '#D0F4DE' }, { symbol: '🦋', color: '#A9DEF9' }, { symbol: '🍓', color: '#FFADAD' },
      { symbol: '🐼', color: '#E5E5E5' }, { symbol: '🌺', color: '#FEC5BB' }, { symbol: '🍦', color: '#FFF1E6' },
      { symbol: '🎨', color: '#CFBAF0' }, { symbol: '🐸', color: '#BDE0A8' }, { symbol: '🍋', color: '#FFF3B0' },
      { symbol: '🦁', color: '#F9C74F' }, { symbol: '🎈', color: '#F28482' }, { symbol: '🌍', color: '#90DBF4' }
    ];
    const boardElement = document.getElementById('board');
    const sizeButtons = [...document.querySelectorAll('.size')];
    const gamePanel = document.querySelector('.game');
    let size = 8, mode = 'single', currentPlayer = 1, playerScores = [0, 0], cards = [], first = null, second = null, locked = false, moves = 0, pairs = 0, seconds = 0, timer;
    function shuffle(items) { return [...items].sort(() => Math.random() - .5); }
    function start() {
      clearInterval(timer); gamePanel.classList.remove('victory'); const chosen = shuffle(icons).slice(0, size); cards = shuffle(chosen.flatMap(icon => [icon, icon])); first = second = null; locked = false; currentPlayer = 1; playerScores = [0, 0]; moves = pairs = seconds = 0;
      boardElement.dataset.size = size; boardElement.style.gridTemplateColumns = `repeat(${size === 18 ? 6 : 4}, 1fr)`; boardElement.innerHTML = '';
      cards.forEach((icon, index) => { const card = document.createElement('button'); card.className = 'memory-card'; card.type = 'button'; card.dataset.index = index; card.dataset.icon = icon.symbol; card.style.setProperty('--symbol-bg', icon.color); card.setAttribute('role', 'gridcell'); card.setAttribute('aria-label', `Karte ${index + 1}, verdeckt`); card.addEventListener('click', () => flip(card)); boardElement.appendChild(card); });
      timer = setInterval(() => { seconds++; document.getElementById('time').textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`; }, 1000); updateStats(); document.getElementById('message').innerHTML = mode === 'two' ? '<b>Spieler 1 ist dran.</b> Finde ein Paar.' : '<b>Bereit?</b> Finde das erste Paar.';
    }
    function updateStats() { document.getElementById('pairs').textContent = pairs; document.getElementById('moves').textContent = moves; document.querySelector('#player1 strong').textContent = playerScores[0]; document.querySelector('#player2 strong').textContent = playerScores[1]; document.getElementById('player1').classList.toggle('active', currentPlayer === 1); document.getElementById('player2').classList.toggle('active', currentPlayer === 2); }
    function flip(card) {
      if (locked || card === first || card.classList.contains('matched')) return;
      card.classList.add('flipped'); card.setAttribute('aria-label', `Karte ${Number(card.dataset.index) + 1}: ${card.dataset.icon}`);
      if (!first) { first = card; return; }
      second = card; moves++; updateStats(); locked = true;
      if (first.dataset.icon === second.dataset.icon) { first.classList.add('matched'); second.classList.add('matched'); pairs++; if (mode === 'two') playerScores[currentPlayer - 1]++; first = second = null; locked = false; updateStats(); if (pairs === cards.length / 2) { clearInterval(timer); const result = mode === 'two' ? (playerScores[0] === playerScores[1] ? 'Unentschieden!' : `Spieler ${playerScores[0] > playerScores[1] ? 1 : 2} gewinnt!`) : 'Gewonnen!'; gamePanel.classList.add('victory'); document.getElementById('message').innerHTML = `<b>${result}</b> ${moves} Züge in ${document.getElementById('time').textContent}.`; } else if (mode === 'two') document.getElementById('message').innerHTML = `<b>Spieler ${currentPlayer} bleibt dran.</b> Noch ein Versuch!`; }
      else setTimeout(() => { [first, second].forEach(item => { item.classList.remove('flipped'); item.setAttribute('aria-label', `Karte ${Number(item.dataset.index) + 1}, verdeckt`); }); first = second = null; if (mode === 'two') { currentPlayer = currentPlayer === 1 ? 2 : 1; document.getElementById('message').innerHTML = `<b>Spieler ${currentPlayer} ist dran.</b> Finde ein Paar.`; } locked = false; updateStats(); }, 1400);
    }
    document.querySelectorAll('.mode').forEach(button => button.addEventListener('click', () => { mode = button.dataset.mode; document.querySelectorAll('.mode').forEach(item => item.classList.toggle('active', item === button)); document.getElementById('players').hidden = mode !== 'two'; start(); }));
    sizeButtons.forEach(button => button.addEventListener('click', () => { size = Number(button.dataset.size); sizeButtons.forEach(item => item.classList.toggle('active', item === button)); start(); }));
    document.getElementById('newGame').addEventListener('click', start); start();
  </script>
</body>
</html>
