<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#10131f" />
  <title>Memory · boyreese.de</title>
  <style>
    :root { --bg: #10131f; --panel: rgba(27, 32, 52, .9); --card: #252b49; --text: #f6f7ff; --muted: #a8afc8; --purple: #9b8cff; --cyan: #5de2e7; --pink: #ff7cb7; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 25px 15px; display: grid; place-items: center; color: var(--text); background: radial-gradient(circle at 15% 10%, #29265b 0, transparent 36%), radial-gradient(circle at 88% 85%, #193d50 0, transparent 32%), var(--bg); font: 16px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; }
    .app { width: min(100%, 620px); }
    .home-link { display: inline-block; margin-bottom: 16px; color: var(--muted); font-size: .82rem; text-decoration: none; }
    .home-link:hover { color: var(--text); }
    header { text-align: center; margin-bottom: 20px; }
    .eyebrow { color: var(--cyan); font-size: .75rem; letter-spacing: .2em; font-weight: 800; text-transform: uppercase; }
    h1 { margin: 7px 0 8px; font-size: clamp(2.7rem, 11vw, 4.7rem); line-height: .95; letter-spacing: -.07em; }
    header p { margin: 0; color: var(--muted); }
    .game { padding: clamp(17px, 4vw, 28px); border: 1px solid rgba(255,255,255,.1); border-radius: 25px; background: var(--panel); box-shadow: 0 24px 70px rgba(0,0,0,.35); backdrop-filter: blur(18px); }
    .sizes { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 20px; color: var(--muted); font-size: .82rem; }
    .size-buttons { display: flex; gap: 5px; }
    button { border: 0; color: inherit; font: inherit; cursor: pointer; }
    .size { padding: 7px 10px; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; color: var(--muted); background: transparent; font-size: .78rem; }
    .size.active { color: var(--text); background: #252b49; border-color: var(--purple); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; text-align: center; }
    .stat { padding: 8px 3px; border-radius: 12px; background: rgba(255,255,255,.045); }
    .stat strong { display: block; color: var(--cyan); font-size: 1.3rem; line-height: 1.1; }
    .stat span { color: var(--muted); font-size: .7rem; }
    .board { display: grid; gap: 8px; margin: 0 auto 21px; max-width: 540px; }
    .memory-card { position: relative; aspect-ratio: 1; min-width: 0; border-radius: 12px; background: var(--card); color: transparent; font-size: clamp(1.35rem, 7vw, 2.8rem); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); transition: transform .18s, background .18s; }
    .memory-card::before { content: '?'; color: var(--purple); font-size: .8em; font-weight: 800; }
    .memory-card.flipped, .memory-card.matched { color: var(--text); background: linear-gradient(135deg, #363d69, #272d4f); transform: rotateY(180deg); }
    .memory-card.flipped::before, .memory-card.matched::before { content: ''; }
    .memory-card.matched { color: var(--cyan); box-shadow: inset 0 0 0 2px rgba(93,226,231,.5); }
    .memory-card:hover:not(:disabled) { transform: translateY(-2px); }
    .memory-card:disabled { cursor: default; }
    button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
    .new-game { display: block; width: 100%; padding: 12px; border-radius: 13px; background: linear-gradient(100deg, var(--purple), #7069f6); font-weight: 800; box-shadow: 0 8px 24px rgba(112,105,246,.25); }
    .new-game:hover { filter: brightness(1.1); }
    .message { min-height: 27px; margin: 0 0 10px; color: var(--muted); text-align: center; font-size: .9rem; }
    .message b { color: var(--text); }
    @media (max-width: 400px) { .game { padding: 15px; } .board { gap: 5px; } .memory-card { border-radius: 8px; } .size { padding: 6px 7px; } }
  </style>
</head>
<body>
  <main class="app">
    <a class="home-link" href="index.html">← Zur Startseite</a>
    <header>
      <div class="eyebrow">boyreese.de · game night</div>
      <h1>Memory</h1>
      <p>Finde alle Paare und trainiere dein Gedächtnis.</p>
    </header>
    <section class="game" aria-label="Memory-Spiel">
      <div class="sizes">
        <span>Größe</span>
        <div class="size-buttons" role="group" aria-label="Spielfeldgröße">
          <button class="size active" data-size="8" type="button">4 × 4</button>
          <button class="size" data-size="12" type="button">4 × 6</button>
          <button class="size" data-size="18" type="button">6 × 6</button>
        </div>
      </div>
      <div class="stats" aria-label="Spielstatistik">
        <div class="stat"><strong id="pairs">0</strong><span>Paare</span></div>
        <div class="stat"><strong id="moves">0</strong><span>Züge</span></div>
        <div class="stat"><strong id="time">0:00</strong><span>Zeit</span></div>
      </div>
      <p class="message" id="message" aria-live="polite"><b>Bereit?</b> Finde das erste Paar.</p>
      <div class="board" id="board" role="grid" aria-label="Memory-Spielfeld"></div>
      <button class="new-game" id="newGame" type="button">Neues Spiel</button>
    </section>
  </main>
  <script>
    const icons = ['🍕','🚀','🌈','🎧','🐙','🌵','🍩','🦊','⚽','🎸','🌙','🍉','🦄','🎲','🐳','🌻','🍀','👾'];
    const boardElement = document.getElementById('board');
    const sizeButtons = [...document.querySelectorAll('.size')];
    let size = 8, cards = [], first = null, second = null, locked = false, moves = 0, pairs = 0, seconds = 0, timer;
    function shuffle(items) { return [...items].sort(() => Math.random() - .5); }
    function start() {
      clearInterval(timer); cards = shuffle(icons.slice(0, size).flatMap(icon => [icon, icon])); first = second = null; locked = false; moves = pairs = seconds = 0;
      boardElement.style.gridTemplateColumns = `repeat(${size === 18 ? 6 : 4}, 1fr)`; boardElement.innerHTML = '';
      cards.forEach((icon, index) => { const card = document.createElement('button'); card.className = 'memory-card'; card.type = 'button'; card.dataset.index = index; card.dataset.icon = icon; card.setAttribute('role', 'gridcell'); card.setAttribute('aria-label', `Karte ${index + 1}, verdeckt`); card.addEventListener('click', () => flip(card)); boardElement.appendChild(card); });
      timer = setInterval(() => { seconds++; document.getElementById('time').textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`; }, 1000); updateStats(); document.getElementById('message').innerHTML = '<b>Bereit?</b> Finde das erste Paar.';
    }
    function updateStats() { document.getElementById('pairs').textContent = pairs; document.getElementById('moves').textContent = moves; }
    function flip(card) {
      if (locked || card === first || card.classList.contains('matched')) return;
      card.classList.add('flipped'); card.textContent = card.dataset.icon; card.setAttribute('aria-label', `Karte ${Number(card.dataset.index) + 1}: ${card.dataset.icon}`);
      if (!first) { first = card; return; }
      second = card; moves++; updateStats(); locked = true;
      if (first.dataset.icon === second.dataset.icon) { first.classList.add('matched'); second.classList.add('matched'); pairs++; first = second = null; locked = false; updateStats(); if (pairs === cards.length / 2) { clearInterval(timer); document.getElementById('message').innerHTML = `<b>Gewonnen!</b> ${moves} Züge in ${document.getElementById('time').textContent}.`; } }
      else setTimeout(() => { [first, second].forEach(item => { item.classList.remove('flipped'); item.textContent = ''; item.setAttribute('aria-label', `Karte ${Number(item.dataset.index) + 1}, verdeckt`); }); first = second = null; locked = false; }, 700);
    }
    sizeButtons.forEach(button => button.addEventListener('click', () => { size = Number(button.dataset.size); sizeButtons.forEach(item => item.classList.toggle('active', item === button)); start(); }));
    document.getElementById('newGame').addEventListener('click', start); start();
  </script>
</body>
</html>
